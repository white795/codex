name: cxline-release

on:
  push:
    tags:
      - "cxline-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build WSL/Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      display_version: ${{ steps.stage.outputs.display_version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" =~ ^cxline-v([0-9]+\.[0-9]+\.[0-9]+)\.([1-9][0-9]*)$ ]]; then
            tag_upstream_version="${BASH_REMATCH[1]}"
          else
            echo "Invalid CxLine tag: $GITHUB_REF_NAME" >&2
            echo "Expected format: cxline-v<upstream-version>.<revision>" >&2
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          if [[ "$tag_upstream_version" != "$cargo_version" ]]; then
            echo "Tag upstream version $tag_upstream_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-ci

      - name: Install Linux release dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            libasound2-dev \
            libcap-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Build and finalize bwrap
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --target "$TARGET" --release --timings --bin bwrap -j "$CARGO_BUILD_JOBS"

          bwrap_path="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$bwrap_path" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Build CxLine binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$GITHUB_SHA"
          cargo build \
            --locked \
            --target "$TARGET" \
            --release \
            --timings \
            --bin codex \
            --bin codex-code-mode-host \
            -j "$CARGO_BUILD_JOBS"

          release_dir="$CARGO_TARGET_DIR/$TARGET/release"
          strip --strip-debug --strip-unneeded \
            "$release_dir/codex" \
            "$release_dir/codex-code-mode-host"

      - name: Stage and verify release artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$CARGO_TARGET_DIR/$TARGET/release"
          mkdir -p "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/codex-home"
          actual_version="$(env CODEX_HOME="$RUNNER_TEMP/codex-home" "$release_dir/codex" --version)"
          if [[ "$actual_version" != codex-cxline\ * ]]; then
            echo "Unexpected binary identity: $actual_version" >&2
            exit 1
          fi
          display_version="${actual_version#codex-cxline }"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^cxline-v([0-9]+\.[0-9]+\.[0-9]+)\.([1-9][0-9]*)$ ]]
            expected_version="${BASH_REMATCH[1]}+cxline.${BASH_REMATCH[2]}"
            if [[ "$display_version" != "$expected_version" ]]; then
              echo "Binary version $display_version does not match tag version $expected_version" >&2
              exit 1
            fi
          fi

          artifact_stem="codex-cxline-$TARGET"
          package_dir="$RUNNER_TEMP/$artifact_stem"
          archive_path="$GITHUB_WORKSPACE/dist/$artifact_stem.tar.gz"

          python3 "$GITHUB_WORKSPACE/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant codex \
            --package-version "$display_version" \
            --package-dir "$package_dir" \
            --archive-output "$archive_path" \
            --entrypoint-bin "$release_dir/codex" \
            --code-mode-host-bin "$release_dir/codex-code-mode-host" \
            --bwrap-bin "$release_dir/bwrap" \
            --force

          cp "$release_dir/codex" "$GITHUB_WORKSPACE/dist/$artifact_stem"
          chmod 0755 "$GITHUB_WORKSPACE/dist/$artifact_stem"

          packaged_version="$(env CODEX_HOME="$RUNNER_TEMP/codex-home" "$package_dir/bin/codex" --version)"
          if [[ "$packaged_version" != "$actual_version" ]]; then
            echo "Packaged binary version $packaged_version does not match $actual_version" >&2
            exit 1
          fi
          tar -tzf "$archive_path" >/dev/null

          (
            cd "$GITHUB_WORKSPACE/dist"
            sha256sum "$artifact_stem" "$artifact_stem.tar.gz" > SHA256SUMS
          )

          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-cxline-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-cxline-${{ env.TARGET }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: Codex CxLine ${{ needs.build.outputs.display_version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Personal WSL/Linux build based on upstream Codex, with CxLine and the selected input UI refinements.

            Target: `${{ env.TARGET }}`
            Binary version: `${{ needs.build.outputs.display_version }}`

            This release is unsigned. Verify downloads with `SHA256SUMS`.
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: false
